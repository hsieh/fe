name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: forthy42/gforth:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Check Gforth version
        run: gforth --version

      - name: Ensure build tools (libcc needs gcc + libtool)
        run: |
          apk add --no-cache build-base libtool libltdl

      - name: Smoke test (startup without config)
        run: ./fe -n -e 'bye'

      - name: Unit tests (pure logic)
        run: gforth-fast test/run-all.fs

      - name: Full-stack tests (stack effects + bounds)
        run: sh test/run-fe-stack.sh
